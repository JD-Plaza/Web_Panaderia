<section class="py-12">

  <div class="mx-auto max-w-7xl px-6">

    <h1 class="mb-8 text-3xl font-black md:text-4xl">
      Nuestros Productos
    </h1>

    <input type="text" placeholder="Buscar producto..." [(ngModel)]="filtro" (input)="filtrar()"
      class="mb-6 w-full rounded-xl border border-gray-200 p-3 outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-200">

    <div class="mb-8 flex flex-wrap gap-3">

      @for (categoria of categorias; track categoria) {

      <button (click)="categoriaSeleccionada = categoria; filtrar()"
        class="rounded-full px-4 py-2 font-medium transition-colors"
        [class]="categoriaSeleccionada === categoria
          ? 'bg-amber-500 text-white'
          : 'bg-amber-100 text-slate-700 hover:bg-amber-200'">

        {{ categoria }}

      </button>

      }

    </div>

    <div class="grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-3">

      @for (producto of productosFiltrados; track producto.id) {

      <app-product-card [product]="producto"></app-product-card>

      }

    </div>

  </div>

</section>
