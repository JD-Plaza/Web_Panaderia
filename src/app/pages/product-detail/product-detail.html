@if (product) {

<section class="px-6 py-12 md:px-20">

  <div class="mx-auto grid max-w-6xl gap-10 md:grid-cols-2">

    <div>

      <img [src]="product.imagen" [alt]="product.nombre" class="w-full rounded-2xl">

    </div>

    <div>

      <span class="rounded-full bg-amber-100 px-4 py-2">

        {{ product.categoria }}

      </span>

      <h1 class="mt-4 mb-4 text-5xl font-black">

        {{ product.nombre }}

      </h1>

      <p class="mb-6 leading-8 text-slate-600">

        {{ product.descripcion }}

      </p>

      <h2 class="mb-6 text-4xl font-black text-amber-600">

        ${{ product.precio }}

      </h2>

      <button (click)="addToCart()" class="rounded-xl bg-amber-600 px-8 py-4 text-white hover:bg-amber-700">

        Agregar al carrito

      </button>

    </div>

  </div>

</section>

}
