<header class="sticky top-0 z-50 w-full border-b border-gray-100 bg-white/90 backdrop-blur-md">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

    <!-- Logo -->
    <div class="flex items-center gap-3">
      <span class="text-3xl">
        <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path
            d="M21 19v-6.733a4 4 0 0 0-1.245-2.9L13.378 3.31a2 2 0 0 0-2.755 0L4.245 9.367A4 4 0 0 0 3 12.267V19a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2" />
        </svg>
      </span>
      <h1 class="text-xl font-bold tracking-tight text-slate-900">
        Dulce Aroma
      </h1>
    </div>

    <!-- Navegación -->
    <nav class="hidden items-center gap-8 md:flex">
      <a routerLink="/" class="font-medium text-slate-700 transition-colors hover:text-amber-600">
        Inicio
      </a>
      <a routerLink="/productos" class="font-medium text-slate-700 transition-colors hover:text-amber-600">
        Productos
      </a>
      <a routerLink="/nosotros" class="font-medium text-slate-700 transition-colors hover:text-amber-600">
        Nosotros
      </a>
      <a routerLink="/contacto" class="font-medium text-slate-700 transition-colors hover:text-amber-600">
        Contacto
      </a>
    </nav>

    <!-- Acciones -->
    <div class="flex items-center gap-4">
      <!-- Botón de carrito con contador de ítems -->
      <a routerLink="/carrito"
        class="relative flex h-10 w-10 items-center justify-center rounded-lg bg-amber-100 text-amber-700 transition-colors hover:bg-amber-200"
        aria-label="Ver carrito">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">

          <path d="M5 7h13.79a2 2 0 0 1 1.99 2.199l-.6 6A2 2 0 0 1 18.19 17H8.64a2 2 0 0 1-1.962-1.608z" />

          <path d="m5 7l-.81-3.243A1 1 0 0 0 3.22 3H2m6 18h2m6 0h2" />

        </svg>
        @if (totalItems > 0) {
        <span
          class="absolute -right-2 -top-2 flex h-6 w-6 items-center justify-center rounded-full bg-red-600 text-xs font-bold text-white">
          {{ totalItems }}
        </span>
        }
      </a>

      <!-- Menú móvil -->
      <button aria-label="Abrir menú"
        class="flex h-10 w-10 items-center justify-center rounded-lg text-slate-700 hover:bg-slate-100 md:hidden">
        ☰
      </button>
    </div>

  </div>
</header>
