<footer class="bg-slate-900 px-6 py-16 text-slate-300 md:px-20">
  <div class="mx-auto grid max-w-7xl gap-10 md:grid-cols-4">

    <!-- Marca -->
    <div>
      <h2 class="mb-4 text-2xl font-bold text-white">
        Dulce Aroma
      </h2>
      <p class="text-slate-400">
        Pastelería artesanal donde cada detalle cuenta. Hecho a mano con amor.
      </p>
    </div>

    <!-- Navegación -->
    <div>
      <h3 class="mb-4 font-bold text-white">
        Navegación
      </h3>
      <ul class="space-y-2">
        <li>
          <a routerLink="/inicio" class="transition-colors hover:text-amber-500">Inicio</a>
        </li>
        <li>
          <a  routerLink="/productos"class="transition-colors hover:text-amber-500">Productos</a>
        </li>
        <li>
          <a  routerLink="/nosotros" class="transition-colors hover:text-amber-500">Nosotros</a>
        </li>
        <li>
          <a  routerLink="/contacto"class="transition-colors hover:text-amber-500">Contacto</a>
        </li>
      </ul>
    </div>

    <!-- Contacto -->
    <div>
      <h3 class="mb-4 font-bold text-white">
        Contacto
      </h3>
      <ul class="space-y-3 text-slate-400">
        <!-- Dirección -->
        <li class="flex items-center gap-2">
          <lucide-icon [img]="MapPinIcon" [size]="18" [strokeWidth]="1.5"></lucide-icon>
          <span>Calle Dulzura 123</span>
        </li>

        <!-- Teléfono -->
        <li class="flex items-center gap-2">
          <lucide-icon [img]="PhoneIcon" [size]="18" [strokeWidth]="1.5"></lucide-icon>
          <span>+1 234 567 890</span>
        </li>

        <!-- Correo -->
        <li class="flex items-center gap-2">
          <lucide-icon [img]="MailIcon" [size]="18" [strokeWidth]="1.5"></lucide-icon>
          <a href="mailto:hola@dulcearoma.com" class="transition-colors hover:text-amber-500">
            hola@dulcearoma.com
          </a>
        </li>
      </ul>
    </div>

    <!-- Redes -->
    <div>
      <h3 class="mb-4 font-bold text-white">
        Síguenos
      </h3>
      <div class="flex gap-3">
        <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Facebook"
          class="flex h-10 w-10 items-center justify-center rounded-full bg-white/15 text-white transition-colors hover:bg-amber-600">
          f
        </a>
        <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram"
          class="flex h-10 w-10 items-center justify-center rounded-full bg-white/15 text-white transition-colors hover:bg-amber-600">
          ig
        </a>
      </div>
    </div>

  </div>

  <div class="mt-10 border-t border-white/10 pt-6 text-center text-sm text-slate-400">
    © 2026 Dulce Aroma. Todos los derechos reservados.
  </div>
</footer>
